{% extends 'l_logs/base.html' %}

{% block content %}
	<p>Topicos:</p>
	<ul>
		{% for topic in topics %}
			<li>
				<a href="{% url 'topic' topic.id %}">{{ topic }}</a>
			</li>
		{% empty %}
			<p>Não há qualquer registro!</p>
		{% endfor %}
	</ul>
	<a href="{% url 'new_topic' %}">Adicionar Topico</a>
{% endblock content %}
