{% extends 'l_logs/base.html' %}
{% load bootstrap3 %}

{% block header %}
	<h2>Adicione um novo topico:</h2>
{% endblock header %}

{% block content %}
	<form action="{% url 'new_topic' %}" method="post">
		{% csrf_token %}
		{% bootstrap_form form %}

		{% buttons %}
			<button name="submit" class="btn btn-primary">Adicionar</button>
		{% endbuttons %}
	</form>
{% endblock content %}
